<section>
  <div class="login">
    <div class="login__logo">
      @if (themeService.theme() == 'light') {
        <img ngSrc="images/logo.svg" alt="" width="95" height="28" />
      } @else if (themeService.theme() == 'dark') {
        <img ngSrc="images/logo-dark.svg" alt="" width="95" height="28" />
      }
    </div>

    <div class="login__title">
        <h1>Welcome to Note</h1>
        <h5>Please log in to continue</h5>
    </div>

    <div class="login__form">
      
    </div>
  </div>
</section>
